services:
  app:
    image: ghcr.io/jarrey/radioforest:latest
    container_name: radioforest
    ports:
      - "${HTTP_PORT:-18882}:18882"
    volumes:
      - ../playlists:/var/www/html/playlists
      - ../backup:/var/www/html/backup
      - ../logs:/var/www/html/logs
      - ../.env:/var/www/html/.env
    env_file:
      - .env
    environment:
      - HTTP_PORT=18882
    restart: unless-stopped
