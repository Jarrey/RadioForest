services:
  app:
    image: ghcr.io/jarrey/radioforest:latest
    container_name: radioforest
    ports:
      - "${HTTP_PORT:-18882}:${HTTP_PORT:-18882}"
      - "${HTTPS_PORT:-18883}:${HTTPS_PORT:-18883}"
    volumes:
      - ../playlists:/var/www/html/playlists
      - ../backup:/var/www/html/backup
      - ../logs:/var/www/html/logs
      - ../.env:/var/www/html/.env
      # Optional SSL certificate mount:
      - ../ssl:/etc/nginx/ssl
    env_file:
      - ../.env
    environment:
      - HTTPS_PORT=18883
      - SSL_CERT_PATH=/etc/nginx/ssl/server.crt
      - SSL_KEY_PATH=/etc/nginx/ssl/server.key
    restart: unless-stopped
