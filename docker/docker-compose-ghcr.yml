version: "3.9"

services:
  app:
    image: ghcr.io/jarrey/radioforest:latest
    ports:
      - "${HTTP_PORT:-18882}:18882"
    volumes:
      - ./backup:/var/www/html/backup
      - ./logs:/var/www/html/logs
      - ./.env:/var/www/html/.env
    environment:
      - HTTP_PORT=18882
    restart: unless-stopped
