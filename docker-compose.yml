version: "3.9"

services:
  app:
    build: .
    ports:
      - "${HTTP_PORT:-18882}:18882"
    volumes:
      - ./:/var/www/html:cached
      - ./backup:/var/www/html/backup
      - ./logs:/var/www/html/logs
    env_file:
      - .env
    environment:
      - HTTP_PORT=18882
    restart: unless-stopped
